<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<title>Snake Evolution - Snake & Centipede Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}
html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
}
body{ position:fixed; inset:0; }
canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }

#hud{
    position:fixed;
    top: calc(env(safe-area-inset-top) + 6px);
    left: 8px; right: 8px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}
.hudGroup{ display:flex; gap:4px; }
.stat{
    padding:4px 7px;
    border-radius:8px;
    background: rgba(3,12,21,.55);
    border: 1px solid rgba(0,255,255,.15);
    backdrop-filter:blur(8px);
}
.stat small{ display:inline-block; font-size:7px; color:#6d8290; margin-right:3px; text-transform:uppercase; }
.stat b{ font-size:11px; color:#66ffff; }

#bossHud{
    position:fixed;
    top: calc(env(safe-area-inset-top) + 40px);
    left:50%; transform:translateX(-50%);
    z-index:30; padding:6px 16px; border-radius:20px;
    background: rgba(255,0,85,0.2);
    border: 1px solid rgba(255,0,85,0.6);
    color: #ff3366; font-weight:900; font-size:13px;
    display:none; text-shadow: 0 0 10px #ff0055;
}

#abilities{
    position:fixed; right: 8px; bottom: 12px;
    z-index:30; display:flex; gap:6px;
}
.ability{
    width:46px; height:46px; border-radius:14px;
    border:1px solid rgba(0,255,255,.2);
    background: rgba(5,15,25,.7); color:#7d929d;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:15px; backdrop-filter:blur(8px);
}
.ability span{ font-size:6px; margin-top:1px; color:#71828b; }

#message{
    position:fixed; top: 75px; left:50%; transform: translateX(-50%);
    z-index:40; font-size:13px; font-weight:800; color:#fff;
    opacity:0; pointer-events:none; transition: opacity .2s;
}

.screen{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
    background: radial-gradient(circle at center, rgba(0,255,255,.06), rgba(1,4,9,.94) 65%);
    backdrop-filter:blur(10px);
}
.panel{
    width:min(380px,88vw); padding:24px 18px; text-align:center;
    border-radius:20px; border: 1px solid rgba(0,255,255,.2); background: rgba(4,12,22,.94);
}
.panel h1{ font-size: 32px; color:#65ffff; }
.mainButton{
    width:100%; height:48px; border:0; border-radius:14px;
    color:white; font-size:14px; font-weight:800;
    background: linear-gradient(135deg, #00a9aa, #6545ff);
    margin-top:15px;
}
.hidden{ display:none !important; }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudGroup">
        <div class="stat"><small>Score</small><b id="score">0</b></div>
        <div class="stat"><small>Lvl</small><b id="level">1</b></div>
    </div>
    <div class="hudGroup">
        <div class="stat"><small>Best</small><b id="best">0</b></div>
    </div>
</div>

<div id="bossHud">⚠️ MEGA PAC-MAN: <span id="bossTime">60</span>s</div>
<div id="message"></div>

<div id="abilities">
    <button class="ability" onclick="dash()">⚡<span>DASH</span></button>
    <button class="ability" onclick="activateShield()">🛡️<span>SHIELD</span></button>
    <button class="ability" onclick="emp()">◉<span>EMP</span></button>
</div>

<div id="startScreen" class="screen">
    <div class="panel">
        <h1>SNAKE ARENA</h1>
        <p style="color:#6d8290; font-size:12px; margin-top:10px;">
            Düşman Yılanlar ve hızlı Çıyanlar sahada spawn olur. Mega Pac-Man 30. saniyede sahaya iner!
        </p>
        <button class="mainButton" onclick="startGame()">OYUNA BAŞLA</button>
    </div>
</div>

<div id="gameOver" class="screen hidden">
    <div class="panel">
        <h1>GAME OVER</h1>
        <p id="finalScore" style="color:#aaa; margin:10px 0;"></p>
        <button class="mainButton" onclick="startGame()">TEKRAR OYNA</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

let W=0, H=0, DPR=1;
let WORLD_WIDTH = 2500, WORLD_HEIGHT = 2500;
let camX = 0, camY = 0;

const SNAKE_RADIUS = 12;
const SEGMENT_DIST = 8;

let snake = [], snakeLength = 25, angle = 0;
let baseSpeed = 2.2;

let enemySnakes = [];
let centipedes = [];
let megaPacman = null;

let foods = [], particles = [];
let running = false, score = 0, level = 1, gameTime = 0;
let best = Number(localStorage.getItem("snakeBest") || 0);

let shieldTimer = 0, dashCooldown = 0, empCooldown = 0;
let isPointerDown = false, pointerPos = { x: 0, y: 0 };

// Portallar
let wormholes = {
    entry: { x: 400, y: 400, r: 28, color: "#00aaff" },
    exit: { x: 2000, y: 2000, r: 28, color: "#ff8800" },
    cooldown: 0
};

function resize(){
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

function createSnake(){
    snake = [];
    const startX = WORLD_WIDTH / 2, startY = WORLD_HEIGHT / 2 + 300;
    angle = 0;
    for(let i=0; i<snakeLength; i++){
        snake.push({ x: startX - i * SEGMENT_DIST, y: startY });
    }
}

// --- DÜŞMAN SPAWN MEKANİZMALARI ---
function spawnEnemySnake(){
    if(enemySnakes.length >= 3 || megaPacman) return;
    let sx = Math.random() * (WORLD_WIDTH - 200) + 100;
    let sy = Math.random() * (WORLD_HEIGHT - 200) + 100;
    
    let body = [];
    for(let i=0; i<15; i++) body.push({x: sx, y: sy});

    enemySnakes.push({
        body: body,
        angle: Math.random() * Math.PI * 2,
        speed: 1.8,
        color: "#ff3355"
    });
}

function spawnCentipede(){
    if(centipedes.length >= 3 || megaPacman) return;
    let sx = Math.random() * (WORLD_WIDTH - 200) + 100;
    let sy = Math.random() * (WORLD_HEIGHT - 200) + 100;

    let legs = [];
    for(let i=0; i<18; i++) legs.push({x: sx, y: sy});

    centipedes.push({
        body: legs,
        angle: Math.random() * Math.PI * 2,
        speed: 2.5,
        wave: 0,
        color: "#33ff66"
    });
}

function spawnMegaPacman(){
    if(megaPacman) return;
    megaPacman = {
        x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2,
        radius: 65, speed: 1.35, angle: 0,
        mouthAngle: 0.2, mouthSpeed: 0.04, color: "#ff0055", bossTimer: 3600
    };
    enemySnakes = []; centipedes = []; // Boss gelince temizle
    document.getElementById("bossHud").style.display = "block";
}

// --- GÜNCELLEME DÖNGÜLERİ ---
function updateSnake(){
    if(!snake.length) return;

    if(isPointerDown){
        const head = snake[0];
        const dx = pointerPos.x + camX - head.x;
        const dy = pointerPos.y + camY - head.y;
        if(Math.hypot(dx, dy) > 15){
            let targetAngle = Math.atan2(dy, dx);
            let diff = targetAngle - angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            angle += Math.max(-0.07, Math.min(0.07, diff));
        }
    }

    let newX = snake[0].x + Math.cos(angle) * baseSpeed;
    let newY = snake[0].y + Math.sin(angle) * baseSpeed;

    newX = Math.max(SNAKE_RADIUS, Math.min(WORLD_WIDTH - SNAKE_RADIUS, newX));
    newY = Math.max(SNAKE_RADIUS, Math.min(WORLD_HEIGHT - SNAKE_RADIUS, newY));

    const newHead = { x: newX, y: newY };
    camX = newHead.x - W / 2; camY = newHead.y - H / 2;

    snake.unshift(newHead);
    while(snake.length > snakeLength) snake.pop();

    // Portal Geçişi
    if(wormholes.cooldown > 0) wormholes.cooldown--;
    if(wormholes.cooldown === 0){
        if(Math.hypot(newHead.x - wormholes.entry.x, newHead.y - wormholes.entry.y) < wormholes.entry.r){
            newHead.x = wormholes.exit.x + Math.cos(angle) * 35;
            newHead.y = wormholes.exit.y + Math.sin(angle) * 35;
            wormholes.cooldown = 60;
        }
    }

    checkFoodCollisions();
}

function updateEnemySnakes(){
    const head = snake[0];
    for(let i = enemySnakes.length - 1; i >= 0; i--){
        let es = enemySnakes[i];
        let esHead = es.body[0];

        // Rastgele/Yeme Doğru Yönlenme
        es.angle += (Math.random() - 0.5) * 0.1;
        esHead.x += Math.cos(es.angle) * es.speed;
        esHead.y += Math.sin(es.angle) * es.speed;

        // Beden takibi
        for(let j = es.body.length - 1; j > 0; j--){
            let prev = es.body[j - 1];
            let curr = es.body[j];
            let dx = prev.x - curr.x, dy = prev.y - curr.y;
            let dist = Math.hypot(dx, dy);
            if(dist > 6){
                curr.x += (dx / dist) * (dist - 6);
                curr.y += (dy / dist) * (dist - 6);
            }
        }

        // Çarpışma Kontrolü
        if(Math.hypot(head.x - esHead.x, head.y - esHead.y) < SNAKE_RADIUS * 2){
            if(shieldTimer <= 0) { gameOver(); return; }
        }
    }
}

function updateCentipedes(){
    const head = snake[0];
    for(let i = centipedes.length - 1; i >= 0; i--){
        let c = centipedes[i];
        let cHead = c.body[0];

        c.wave += 0.2;
        c.angle += Math.sin(c.wave) * 0.05;
        
        cHead.x += Math.cos(c.angle) * c.speed;
        cHead.y += Math.sin(c.angle) * c.speed;

        // Beden takibi
        for(let j = c.body.length - 1; j > 0; j--){
            let prev = c.body[j - 1], curr = c.body[j];
            let dist = Math.hypot(prev.x - curr.x, prev.y - curr.y);
            if(dist > 7){
                curr.x += ((prev.x - curr.x)/dist) * (dist - 7);
                curr.y += ((prev.y - curr.y)/dist) * (dist - 7);
            }
        }

        if(Math.hypot(head.x - cHead.x, head.y - cHead.y) < SNAKE_RADIUS + 10){
            if(shieldTimer <= 0) { gameOver(); return; }
        }
    }
}

function updateMegaPacman(){
    if(!megaPacman) return;
    let p = megaPacman;
    p.bossTimer--;

    document.getElementById("bossTime").textContent = Math.ceil(p.bossTimer / 60);
    if(p.bossTimer <= 0){
        megaPacman = null;
        document.getElementById("bossHud").style.display = "none";
        score += 1000;
        return;
    }

    const head = snake[0];
    let dx = head.x - p.x, dy = head.y - p.y;
    p.angle = Math.atan2(dy, dx);

    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;

    p.mouthAngle += p.mouthSpeed;
    if(p.mouthAngle > 0.45 || p.mouthAngle < 0.05) p.mouthSpeed = -p.mouthSpeed;

    if(Math.hypot(dx, dy) < SNAKE_RADIUS + p.radius){
        if(shieldTimer <= 0) { gameOver(); return; }
    }
}

function checkFoodCollisions(){
    const head = snake[0];
    for(let i = foods.length - 1; i >= 0; i--){
        if(Math.hypot(head.x - foods[i].x, head.y - foods[i].y) < SNAKE_RADIUS + 8){
            foods.splice(i, 1);
            score += 10;
            snakeLength += 1;
            document.getElementById("score").textContent = score;
        }
    }
}

function spawnFood(){
    if(foods.length < 50){
        foods.push({ x: Math.random() * WORLD_WIDTH, y: Math.random() * WORLD_HEIGHT });
    }
}

// --- ÇİZİM İŞLEMLERİ ---
function drawMap(){
    ctx.fillStyle = "#02050a"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(-camX, -camY);

    // Çerçeve
    ctx.strokeStyle = "rgba(0,255,255,0.3)"; ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // Portallar
    ctx.fillStyle = wormholes.entry.color;
    ctx.beginPath(); ctx.arc(wormholes.entry.x, wormholes.entry.y, wormholes.entry.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = wormholes.exit.color;
    ctx.beginPath(); ctx.arc(wormholes.exit.x, wormholes.exit.y, wormholes.exit.r, 0, Math.PI*2); ctx.fill();

    // Yemler
    ctx.fillStyle = "#66ffff";
    for(let f of foods){
        ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI*2); ctx.fill();
    }

    // Oyuncu Yılan
    for(let i=snake.length-1; i>=0; i--){
        ctx.fillStyle = i === 0 ? "#ffffff" : "#00ffcc";
        ctx.beginPath(); ctx.arc(snake[i].x, snake[i].y, SNAKE_RADIUS, 0, Math.PI*2); ctx.fill();
    }

    // Düşman Yılanlar
    for(let es of enemySnakes){
        ctx.fillStyle = es.color;
        for(let b of es.body){
            ctx.beginPath(); ctx.arc(b.x, b.y, SNAKE_RADIUS - 2, 0, Math.PI*2); ctx.fill();
        }
    }

    // Çıyanlar
    for(let c of centipedes){
        ctx.fillStyle = c.color;
        for(let j=0; j<c.body.length; j++){
            let b = c.body[j];
            ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
            // Bacaklar
            ctx.strokeStyle = "#33ff66"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(b.x - 10, b.y); ctx.lineTo(b.x + 10, b.y); ctx.stroke();
        }
    }

    // Mega Pacman
    if(megaPacman){
        let p = megaPacman;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, p.angle + p.mouthAngle * Math.PI, p.angle + (2 - p.mouthAngle) * Math.PI);
        ctx.lineTo(p.x, p.y);
        ctx.fill();
    }

    ctx.restore();
}

// --- KONTROLLER & DÖNGÜ ---
function dash(){
    if(dashCooldown > 0) return;
    baseSpeed = 4.5; dashCooldown = 300;
    setTimeout(() => baseSpeed = 2.2, 400);
}
function activateShield(){ shieldTimer = 180; }
function emp(){ enemySnakes = []; centipedes = []; }

window.addEventListener("touchstart", e => { isPointerDown = true; updatePointer(e); });
window.addEventListener("touchmove", updatePointer);
window.addEventListener("touchend", () => isPointerDown = false);
window.addEventListener("mousedown", e => { isPointerDown = true; updatePointer(e); });
window.addEventListener("mousemove", updatePointer);
window.addEventListener("mouseup", () => isPointerDown = false);

function updatePointer(e){
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointerPos = { x: clientX, y: clientY };
}

function startGame(){
    score = 0; gameTime = 0; snakeLength = 25;
    enemySnakes = []; centipedes = []; megaPacman = null; foods = [];
    createSnake();
    running = true;
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");
    document.getElementById("bossHud").style.display = "none";
}

function gameOver(){
    running = false;
    if(score > best){ best = score; localStorage.setItem("snakeBest", best); }
    document.getElementById("finalScore").textContent = "Skor: " + score;
    document.getElementById("gameOver").classList.remove("hidden");
}

function loop(){
    requestAnimationFrame(loop);
    if(running){
        gameTime++;
        updateSnake();
        updateEnemySnakes();
        updateCentipedes();
        updateMegaPacman();

        if(Math.random() < 0.05) spawnFood();
        if(Math.random() < 0.005) spawnEnemySnake();
        if(Math.random() < 0.005) spawnCentipede();

        if(gameTime === 1800) spawnMegaPacman(); // 30. saniye Boss

        if(shieldTimer > 0) shieldTimer--;
        if(dashCooldown > 0) dashCooldown--;
    }
    drawMap();
}

resize();
loop();
</script>
</body>
</html>
