<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#02050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake Evolution">

<title>Snake Evolution - Action XP & Smooth Gameplay</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050a;
    touch-action:none;
    overscroll-behavior:none;
    font-family:-apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                Arial,
                sans-serif;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* HUD */

#hud{
    position:fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: calc(env(safe-area-inset-left) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.hudLeft,
.hudRight{
    display:flex;
    gap:6px;
    align-items:center;
}

.stat{
    min-width:58px;
    padding:7px 9px;
    border-radius:12px;
    background: rgba(3,12,21,.72);
    border: 1px solid rgba(0,255,255,.18);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
}

.stat small{
    display:block;
    font-size:8px;
    color:#6d8290;
    letter-spacing:1px;
    text-transform:uppercase;
}

.stat b{
    display:block;
    margin-top:1px;
    font-size:14px;
    color:#66ffff;
}

/* XP BAR */

#xpBox{
    position:fixed;
    left:50%;
    bottom: calc(env(safe-area-inset-bottom) + 13px);
    transform:translateX(-50%);
    width:min(220px,45vw);
    z-index:20;
    pointer-events:none;
}

#xpText{
    text-align:center;
    font-size:8px;
    color:#637784;
    margin-bottom:3px;
}

#xpBar{
    height:5px;
    border-radius:10px;
    background:#0b151d;
    overflow:hidden;
    border:1px solid #17303a;
}

#xpFill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #00ffff, #7755ff);
    box-shadow: 0 0 10px #00ffff;
    transition:width .2s;
}

/* ABILITIES */

#abilities{
    position:fixed;
    right: calc(env(safe-area-inset-right) + 12px);
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    z-index:30;
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.ability{
    width:55px;
    height:55px;
    border-radius:18px;
    border:1px solid rgba(0,255,255,.25);
    background: rgba(5,15,25,.82);
    color:#7d929d;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:18px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
    transition: transform .08s, background .1s;
}

.ability span{
    font-size:7px;
    margin-top:2px;
    color:#71828b;
    letter-spacing:.5px;
}

.ability:active{
    transform:scale(.86);
    background: rgba(0,255,255,.18);
}

/* MESSAGES */

#message{
    position:fixed;
    top: calc(env(safe-area-inset-top) + 90px);
    left:50%;
    transform: translateX(-50%) translateY(-8px);
    z-index:40;
    font-size:16px;
    font-weight:800;
    color:#fff;
    text-shadow: 0 0 15px currentColor;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
    transition: opacity .2s, transform .2s;
}

#riskStatus{
    position:fixed;
    top: calc(env(safe-area-inset-top) + 55px);
    left:50%;
    transform: translateX(-50%);
    z-index:35;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;
    color:#ff3366;
    text-shadow: 0 0 10px #ff3366;
    background: rgba(255,0,85,0.15);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,0,85,0.4);
    display: none;
}

/* SCREENS */

.screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
        calc(env(safe-area-inset-top) + 20px)
        calc(env(safe-area-inset-right) + 20px)
        calc(env(safe-area-inset-bottom) + 20px)
        calc(env(safe-area-inset-left) + 20px);
    background: radial-gradient(circle at center, rgba(0,255,255,.06), rgba(1,4,9,.94) 65%);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.panel{
    width:min(430px,90vw);
    padding:30px 22px;
    text-align:center;
    border-radius:25px;
    border: 1px solid rgba(0,255,255,.25);
    background: rgba(4,12,22,.94);
    box-shadow: 0 25px 100px rgba(0,0,0,.5), 0 0 50px rgba(0,255,255,.05);
}

.panel h1{
    font-size: clamp(36px,12vw,58px);
    letter-spacing:5px;
    color:#65ffff;
    text-shadow: 0 0 30px rgba(0,255,255,.7);
    margin-bottom:4px;
}

.subtitle{
    font-size:11px;
    color:#6b8490;
    letter-spacing:5px;
    margin-bottom:24px;
}

.panel p{
    color:#71828d;
    font-size:13px;
    line-height:1.7;
    margin-bottom:20px;
}

.mainButton{
    width:100%;
    height:55px;
    border:0;
    border-radius:16px;
    color:white;
    font-size:15px;
    font-weight:800;
    letter-spacing:1px;
    background: linear-gradient(135deg, #00a9aa, #6545ff);
    box-shadow: 0 0 25px rgba(0,255,255,.15);
    touch-action:manipulation;
}

.mainButton:active{
    transform:scale(.97);
}

.upgrades{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.upgrade{
    width:100%;
    padding:13px;
    border-radius:14px;
    border:1px solid rgba(0,255,255,.15);
    background: rgba(10,25,38,.8);
    color:white;
    text-align:left;
    font-size:13px;
    font-weight:bold;
}

.upgrade small{
    display:block;
    color:#6e818b;
    margin-top:3px;
    font-weight:normal;
}

.hidden{
    display:none !important;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudLeft">
        <div class="stat"><small>Score</small><b id="score">0</b></div>
        <div class="stat"><small>Level</small><b id="level">1</b></div>
        <div class="stat"><small>Snake</small><b id="length">20</b></div>
    </div>
    <div class="hudRight">
        <div class="stat"><small>Combo</small><b id="combo">x1</b></div>
        <div class="stat"><small>Best</small><b id="best">0</b></div>
    </div>
</div>

<div id="riskStatus">⚠️ RISK ZONE (XP & 3x SCORE)</div>
<div id="message"></div>

<div id="xpBox">
    <div id="xpText">XP 0 / 100</div>
    <div id="xpBar"><div id="xpFill"></div></div>
</div>

<div id="abilities">
    <button class="ability" id="dashBtn" ontouchstart="mobileAction('dash',event)" onclick="mobileAction('dash',event)">⚡<span>DASH</span></button>
    <button class="ability" id="shieldBtn" ontouchstart="mobileAction('shield',event)" onclick="mobileAction('shield',event)">🛡️<span>SHIELD</span></button>
    <button class="ability" id="empBtn" ontouchstart="mobileAction('emp',event)" onclick="mobileAction('emp',event)">◉<span>EMP</span></button>
</div>

<div id="startScreen" class="screen">
    <div class="panel">
        <h1>SNAKE</h1>
        <div class="subtitle">EVOLUTION</div>
        <p>Level atlamak için düşman avla veya riskli bölgede kal!<br>Kendi gövdenin üstünden rahatça geçebilirsin.</p>
        <button class="mainButton" onclick="startGame()">OYUNA BAŞLA</button>
    </div>
</div>

<div id="gameOver" class="screen hidden">
    <div class="panel">
        <h1>GAME OVER</h1>
        <p id="finalScore"></p>
        <button class="mainButton" onclick="startGame()">TEKRAR OYNA</button>
    </div>
</div>

<div id="upgradeScreen" class="screen hidden">
    <div class="panel">
        <h1 style="font-size:34px">LEVEL UP</h1>
        <p>Yılanını geliştir.</p>
        <div class="upgrades">
            <button class="upgrade" onclick="upgrade('speed')">⚡ SPEED<small>Hareket ve dönüş hızını artır</small></button>
            <button class="upgrade" onclick="upgrade('magnet')">🧲 MAGNET<small>Yem çekim menzilini artır</small></button>
            <button class="upgrade" onclick="upgrade('shield')">🛡️ SHIELD<small>Kalkan süresini artır</small></button>
        </div>
    </div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

let W=0, H=0, DPR=1;

const SNAKE_RADIUS = 12; 
const SEGMENT_DISTANCE = 8; 

let baseSpeed = 2.0; 
let turnSpeed = 0.055; 

let snake = [];
let snakeLength = 25; 
let angle = 0; 

let enemies = [];
let foods = [];
let obstacles = [];
let particles = [];

let running = false;
let score = 0, level = 1, xp = 0, nextLevelXp = 100, combo = 1;
let inRiskZone = false;

let best = Number(localStorage.getItem("snakeEvolutionBest") || 0);

let speedLevel = 1, magnetLevel = 0, shieldLevel = 1;
let shieldTimer = 0, dashCooldown = 0, empCooldown = 0;

let bossSpawnTimer = 0;
let bossActive = false;

let audioCtx = null;
let isPointerDown = false;
let pointerPos = { x: 0, y: 0 };

function initAudio(){
    if(audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}

function sound(frequency=500, duration=.08, type="sine", volume=.035){
    if(!audioCtx) return;
    try{
        if(audioCtx.state==="suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
}

function haptic(pattern=10){
    if("vibrate" in navigator){
        try{ navigator.vibrate(pattern); }catch(e){}
    }
}

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if(obstacles.length === 0) generateMap();
}

window.addEventListener("resize", resize, {passive:true});

function generateMap(){
    obstacles = [];
    const count = Math.max(2, Math.floor((W * H) / 120000));

    for(let i=0; i<count; i++){
        let ox = 80 + Math.random() * (W - 160);
        let oy = 80 + Math.random() * (H - 160);
        if(Math.hypot(ox - W/2, oy - H/2) > 160){
            obstacles.push({ x: ox, y: oy, r: 10 + Math.random() * 12 });
        }
    }
}

function createSnake(){
    snake = [];
    const startX = W / 4;
    const startY = H / 2;
    angle = 0;

    for(let i=0; i<snakeLength; i++){
        snake.push({
            x: startX - i * SEGMENT_DISTANCE,
            y: startY
        });
    }
}

function updateSnake(){
    if(!snake.length) return;

    if(isPointerDown){
        const head = snake[0];
        const dx = pointerPos.x - head.x;
        const dy = pointerPos.y - head.y;
        
        const targetAngle = Math.atan2(dy, dx);

        let diff = targetAngle - angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        const currentTurnSpeed = turnSpeed + (speedLevel * 0.003);
        angle += Math.max(-currentTurnSpeed, Math.min(currentTurnSpeed, diff));
    }

    const currentSpeed = baseSpeed + ((speedLevel - 1) * 0.25);
    
    let newX = snake[0].x + Math.cos(angle) * currentSpeed;
    let newY = snake[0].y + Math.sin(angle) * currentSpeed;

    if (newX < 0) newX = W;
    else if (newX > W) newX = 0;

    if (newY < 0) newY = H;
    else if (newY > H) newY = 0;

    const newHead = { x: newX, y: newY };

    const distToCenter = Math.hypot(newHead.x - W/2, newHead.y - H/2);
    if(distToCenter < 120){
        if(!inRiskZone){
            inRiskZone = true;
            document.getElementById("riskStatus").style.display = "block";
        }
        if(Math.random() < 0.03){
            gainXP(1);
        }
    } else {
        if(inRiskZone){
            inRiskZone = false;
            document.getElementById("riskStatus").style.display = "none";
        }
    }

    for(const obs of obstacles){
        if(Math.hypot(newHead.x - obs.x, newHead.y - obs.y) < SNAKE_RADIUS + obs.r){
            if(shieldTimer > 0){
                shieldTimer = 0;
                angle += Math.PI;
                showMessage("🛡️ SHIELD BLOCKED");
            } else {
                gameOver();
                return;
            }
        }
    }

    snake.unshift(newHead);

    while(snake.length > snakeLength){
        snake.pop();
    }

    checkFoodCollision();
}

function spawnFood(){
    if(foods.length >= 10) return;
    foods.push({
        x: 40 + Math.random() * (W - 80),
        y: 40 + Math.random() * (H - 80),
        r: 8,
        val: 10
    });
}

function checkFoodCollision(){
    const head = snake[0];

    for(let i = foods.length - 1; i >= 0; i--){
        const f = foods[i];
        const dist = Math.hypot(head.x - f.x, head.y - f.y);

        if(magnetLevel > 0 && dist < 120 + (magnetLevel * 30)){
            f.x += (head.x - f.x) * 0.08;
            f.y += (head.y - f.y) * 0.08;
        }

        if(dist < SNAKE_RADIUS + f.r){
            foods.splice(i, 1);
            eatFood(f.val || 10);
        }
    }
}

function eatFood(val = 10){
    const multiplier = inRiskZone ? 3 : 1;
    const finalVal = val * multiplier;

    score += finalVal * combo;
    snakeLength += Math.max(1, Math.floor(val / 5)); 
    combo = Math.min(10, combo + 1);

    createExplosion(snake[0].x, snake[0].y, inRiskZone ? "#ff0055" : "#00ffff", 8);
    sound(600 + combo * 30, .08, "sine", .04);
    haptic(8);
    updateHUD();
}

function spawnEnemy(){
    if(enemies.length >= 3) return;

    let body = [];
    const ex = 50 + Math.random() * (W - 100);
    const ey = 50 + Math.random() * (H - 100);
    const eAngle = Math.random() * Math.PI * 2;

    for(let i=0; i<20; i++){
        body.push({ x: ex - i * SEGMENT_DISTANCE, y: ey });
    }

    enemies.push({
        body,
        angle: eAngle,
        speed: 1.6,
        radius: SNAKE_RADIUS * 0.8,
        color: Math.random() > .5 ? "#ff3d88" : "#ff791c",
        isBoss: false
    });
}

function spawnBoss(){
    if(bossActive) return;
    bossActive = true;
    showMessage("⚠️ DEV BOSS YILAN ÇIKTI!");

    let body = [];
    const ex = W / 2;
    const ey = H / 2;

    for(let i=0; i<60; i++){
        body.push({ x: ex - i * 12, y: ey });
    }

    enemies.push({
        body,
        angle: Math.random() * Math.PI * 2,
        speed: 1.3,
        radius: SNAKE_RADIUS * 1.8,
        color: "#ff0055",
        isBoss: true
    });

    sound(150, .5, "sawtooth", .1);
}

function killEnemy(index){
    const e = enemies[index];
    if(!e) return;

    if(e.isBoss){
        bossActive = false;
        bossSpawnTimer = 0;
        score += 300;
        gainXP(50);
        showMessage("🏆 DEV BOSS YOK EDİLDİ!");
    } else {
        score += 50;
        gainXP(25);
        showMessage("⚔️ DÜŞMAN İMHA EDİLDİ!");
    }

    for(let i = 0; i < e.body.length; i += 2){
        foods.push({
            x: e.body[i].x + (Math.random() * 20 - 10),
            y: e.body[i].y + (Math.random() * 20 - 10),
            r: e.isBoss ? 10 : 7,
            val: e.isBoss ? 35 : 15
        });
    }

    createExplosion(e.body[0].x, e.body[0].y, e.color, e.isBoss ? 60 : 25);
    sound(200, .3, "sawtooth", .1);
    haptic([30, 60, 30]);
    enemies.splice(index, 1);
}

function updateEnemies(){
    for(let i = enemies.length - 1; i >= 0; i--){
        const e = enemies[i];
        const eHead = e.body[0];

        if(Math.random() < 0.03 && snake.length){
            const dx = snake[0].x - eHead.x;
            const dy = snake[0].y - eHead.y;
            e.angle = Math.atan2(dy, dx);
        }

        let newX = eHead.x + Math.cos(e.angle) * e.speed;
        let newY = eHead.y + Math.sin(e.angle) * e.speed;

        if (newX < 0) newX = W;
        else if (newX > W) newX = 0;
        if (newY < 0) newY = H;
        else if (newY > H) newY = 0;

        e.body.unshift({ x: newX, y: newY });
        e.body.pop();

        const newEHead = e.body[0];

        for(let j = 5; j < snake.length; j++){
            if(Math.hypot(newEHead.x - snake[j].x, newEHead.y - snake[j].y) < e.radius + SNAKE_RADIUS){
                killEnemy(i);
                return;
            }
        }

        for(let j = 0; j < e.body.length; j++){
            if(Math.hypot(snake[0].x - e.body[j].x, snake[0].y - e.body[j].y) < SNAKE_RADIUS + e.radius){
                if(shieldTimer > 0){
                    shieldTimer = 0;
                    killEnemy(i);
                    return;
                } else {
                    gameOver();
                    return;
                }
            }
        }
    }
}

function createExplosion(x, y, color, count){
    for(let i=0; i<count; i++){
        const a = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 4;
        particles.push({
            x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
            life: 1, size: 2 + Math.random() * 4, color
        });
    }
}

function updateParticles(){
    for(let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.03;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function drawMap(){
    ctx.fillStyle = "#02050a";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    const riskGrad = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, 120);
    riskGrad.addColorStop(0, "rgba(255, 0, 85, 0.25)");
    riskGrad.addColorStop(1, "rgba(255, 0, 85, 0)");
    ctx.fillStyle = riskGrad;
    ctx.beginPath();
    ctx.arc(W/2, H/2, 120, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 0, 85, 0.4)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.stroke();
    ctx.restore();

    for(const obs of obstacles){
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(100,70,255,.3)";
        ctx.fillStyle = "rgba(15,22,38,.9)";
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(110,80,255,.4)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }
}

function drawSnake(){
    if(!snake.length) return;

    ctx.save();
    ctx.shadowBlur = 12;
    ctx.shadowColor = shieldTimer > 0 ? "#7755ff" : (inRiskZone ? "#ff0055" : "#00ffff");

    for(let i = snake.length - 1; i >= 0; i--){
        const p = snake[i];
        const ratio = i / snake.length;
        const radius = SNAKE_RADIUS * (1 - ratio * 0.3);

        ctx.fillStyle = i === 0 ? "#ffffff" : `hsl(${inRiskZone ? 340 : 180 + ratio * 40}, 100%, 50%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    const head = snake[0];
    const eyeOffset = 6;
    ctx.fillStyle = "#02050a";
    ctx.beginPath();
    ctx.arc(head.x + Math.cos(angle - 0.5) * eyeOffset, head.y + Math.sin(angle - 0.5) * eyeOffset, 2.5, 0, Math.PI * 2);
    ctx.arc(head.x + Math.cos(angle + 0.5) * eyeOffset, head.y + Math.sin(angle + 0.5) * eyeOffset, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawEnemies(){
    for(const e of enemies){
        ctx.save();
        ctx.shadowBlur = e.isBoss ? 20 : 10;
        ctx.shadowColor = e.color;
        ctx.fillStyle = e.color;

        for(let i = e.body.length - 1; i >= 0; i--){
            const p = e.body[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, e.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

function drawFoods(){
    for(const f of foods){
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = f.val > 15 ? "#ffaa00" : "#00ffff";
        ctx.fillStyle = f.val > 15 ? "#ffcc00" : "#66ffff";
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawParticles(){
    for(const p of particles){
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function gainXP(amount){
    xp += amount;
    if(xp >= nextLevelXp){
        xp -= nextLevelXp;
        level++;
        nextLevelXp = Math.floor(nextLevelXp * 1.5); 
        running = false;
        isPointerDown = false;
        document.getElementById("upgradeScreen").classList.remove("hidden");
    }
    updateHUD();
}

function upgrade(type){
    if(type === 'speed') speedLevel++;
    if(type === 'magnet') magnetLevel++;
    if(type === 'shield') shieldLevel++;

    document.getElementById("upgradeScreen").classList.add("hidden");
    running = true;
}

function dash(){
    if(!running || dashCooldown > 0) return;
    dashCooldown = 1000;
    baseSpeed *= 1.8;
    setTimeout(() => {
        if(running) baseSpeed /= 1.8;
    }, 400);
    createExplosion(snake[0].x, snake[0].y, "#ffffff", 15);
}

function activateShield(){
    if(!running || shieldTimer > 0) return;
    shieldTimer = 3000 * shieldLevel;
    showMessage("🛡️ SHIELD ACTIVATED");
}

function emp(){
    if(!running || empCooldown > 0) return;
    empCooldown = 4000;
    
    for(let i = enemies.length - 1; i >= 0; i--){
        killEnemy(i);
    }
    
    createExplosion(W/2, H/2, "#7c5cff", 50);
    showMessage("◉ EMP PULSE!");
}

function mobileAction(act, e){
    if(e) { e.preventDefault(); e.stopPropagation(); }
    initAudio();
    if(act === 'dash') dash();
    if(act === 'shield') activateShield();
    if(act === 'emp') emp();
}

function pointerStart(e){
    if(e.target.closest("#abilities") || e.target.closest(".screen")) return;
    initAudio();
    isPointerDown = true;
    pointerMove(e);
}

function pointerMove(e){
    if(!isPointerDown) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointerPos = { x: clientX, y: clientY };
}

function pointerEnd(){
    isPointerDown = false;
}

window.addEventListener("touchstart", pointerStart, {passive:false});
window.addEventListener("touchmove", pointerMove, {passive:false});
window.addEventListener("touchend", pointerEnd, {passive:false});

window.addEventListener("mousedown", pointerStart);
window.addEventListener("mousemove", pointerMove);
window.addEventListener("mouseup", pointerEnd);

function startGame(){
    initAudio();
    
    score = 0; 
    level = 1; 
    xp = 0; 
    nextLevelXp = 100;
    combo = 1;
    snakeLength = 25;
    inRiskZone = false;
    
    speedLevel = 1; 
    magnetLevel = 0; 
    shieldLevel = 1;
    baseSpeed = 2.0; 
    shieldTimer = 0; 
    dashCooldown = 0; 
    empCooldown = 0;

    bossSpawnTimer = 0; 
    bossActive = false;
    foods = []; 
    enemies = []; 
    particles = [];

    generateMap();
    createSnake();
    running = true;

    document.getElementById("riskStatus").style.display = "none";
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");
    document.getElementById("upgradeScreen").classList.add("hidden");

    updateHUD();
}

function gameOver(){
    running = false;
    isPointerDown = false;
    document.getElementById("riskStatus").style.display = "none";
    if(score > best){
        best = score;
        localStorage.setItem("snakeEvolutionBest", best);
    }

    document.getElementById("finalScore").innerHTML = `Skor: <b>${score}</b><br>Level: <b>${level}</b>`;
    document.getElementById("gameOver").classList.remove("hidden");
}

function updateHUD(){
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("length").textContent = snakeLength;
    document.getElementById("combo").textContent = "x" + combo;
    document.getElementById("best").textContent = best;
    document.getElementById("xpText").textContent = "XP " + xp + " / " + nextLevelXp;
    document.getElementById("xpFill").style.width = Math.min(100, (xp / nextLevelXp) * 100) + "%";
}

function showMessage(txt){
    const el = document.getElementById("message");
    el.textContent = txt;
    el.style.opacity = "1";
    setTimeout(() => el.style.opacity = "0", 1200);
}

function loop(){
    requestAnimationFrame(loop);

    if(running){
        updateSnake();
        updateEnemies();
        updateParticles();

        if(Math.random() < 0.03) spawnFood();
        if(Math.random() < 0.005) spawnEnemy();

        bossSpawnTimer++;
        if(bossSpawnTimer > 1500 && !bossActive){
            spawnBoss();
        }

        if(dashCooldown > 0) dashCooldown -= 16;
        if(empCooldown > 0) empCooldown -= 16;
        if(shieldTimer > 0) shieldTimer -= 16;
    }

    drawMap();
    drawFoods();
    drawEnemies();
    drawSnake();
    drawParticles();
}

resize();
loop();

</script>
</body>
</html>
